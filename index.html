<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KE's Warehouse</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent-color: #FFE3B3; 
            --text-color: #ffffff; 
            --border-color: rgba(255, 255, 255, 0.12);
            --hover-bg: rgba(255, 227, 179, 0.08);
            --active-bg: rgba(255, 227, 179, 0.18);
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            position: fixed; 
            overflow: hidden; 
            overscroll-behavior: none; 
            background-color: #030307; 
            color: white; 
            font-family: var(--font-sans); 
            -webkit-overflow-scrolling: touch; 
        }
        
        #bg-canvas, #top-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #bg-canvas { z-index: 0; }
        #top-canvas { z-index: 50; } 
        
        .content-layer { position: relative; z-index: 60; width: 100%; height: 100vh; pointer-events: none; }
        
        nav, .page { pointer-events: auto; }
        
        nav { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            padding: 24px 0; 
            background: linear-gradient(to bottom, rgba(3,3,7,0.95), rgba(3,3,7,0)); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        nav button { 
            background: none; 
            border: none; 
            color: #888; 
            padding: 0 20px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px; 
            transition: 0.3s; 
            letter-spacing: 2px; 
            font-family: var(--font-mono);
        }
        nav button.active, nav button:hover { 
            color: var(--accent-color); 
            text-shadow: 0 0 15px rgba(255,227,179,0.6); 
        }
        
        .lang-btn {
            position: absolute;
            right: 40px;          
            color: var(--accent-color) !important;
            border: 1px solid rgba(255, 227, 179, 0.25) !important;
            border-radius: 20px;
            padding: 4px 14px !important;
            font-size: 12px !important;
            letter-spacing: 1px !important;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 15px rgba(255, 227, 179, 0.3);
        }
        
        .page { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100vh;
            padding-top: 85px; 
            opacity: 0; 
            pointer-events: none; 
            transform: scale(0.98) translateY(10px); 
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform; 
        }
        
        .page.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: scale(1) translateY(0); 
        }

        /* Home Page */
        #home {
            text-align: center;
            padding-top: 180px;
        }

        /* Works Page Layout */
        #works {
            height: calc(100vh - 85px);
            padding: 10px 24px 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ptc-workspace {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1400px;
            height: 100%;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            background: rgba(15, 18, 23, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: left;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* Strict Vertical Column Sidebar */
        .ptc-sidebar {
            width: 320px;
            min-width: 320px;
            max-width: 320px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            user-select: none;
            background: rgba(3, 3, 7, 0.55);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            background: rgba(0, 0, 0, 0.3);
        }

        .brand-title {
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: var(--accent-color);
        }

        .tree-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        /* Enforce Vertical Flow Across All Tree Levels */
        .tree-category { 
            width: 100%;
            display: flex; 
            flex-direction: column; 
        }

        .title-node {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 8px 10px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s ease;
            text-transform: uppercase;
        }
        .title-node:hover { background-color: var(--hover-bg); }
        .title-node .icon { margin-right: 8px; font-size: 0.7rem; transition: transform 0.2s ease; }

        .subcategory-list {
            width: 100%;
            padding-left: 12px;
            border-left: 1px dashed var(--border-color);
            margin-left: 10px;
            display: none;
            flex-direction: column;
        }
        .subcategory-list.open { display: flex; }

        .subcategory-node {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 6px 8px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: #d1d5db;
            cursor: pointer;
            border-radius: 4px;
            margin: 2px 0;
        }
        .subcategory-node:hover { background-color: var(--hover-bg); color: var(--accent-color); }

        .project-list {
            width: 100%;
            padding-left: 12px;
            border-left: 1px dashed var(--border-color);
            margin-left: 8px;
            display: none;
            flex-direction: column;
        }
        .project-list.open { display: flex; }

        .project-node {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 5px 8px;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            color: #8b949e;
            cursor: pointer;
            border-radius: 4px;
            margin: 1px 0;
            transition: all 0.15s ease;
        }
        .project-node:hover { color: #fff; background-color: var(--hover-bg); }
        .project-node.active {
            color: var(--accent-color);
            background-color: var(--active-bg);
            font-weight: 600;
            border-left: 2px solid var(--accent-color);
        }

        /* Main Viewport Container */
        .ptc-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: rgba(3, 3, 7, 0.2);
            overflow: hidden;
        }

        .top-bar {
            height: 48px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 18, 23, 0.5);
        }

        .breadcrumb {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .breadcrumb .separator { color: #8b949e; }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #ccc;
            padding: 4px 12px;
            border-radius: 12px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .control-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

        .gallery-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8b949e;
            text-align: center;
            font-family: var(--font-mono);
        }
        .empty-state h3 { color: var(--accent-color); margin-bottom: 8px; font-weight: 400; }

        .image-stream {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .gallery-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }
        .gallery-card:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .gallery-card img { width: 100%; height: auto; display: block; }

        .card-meta {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
        }

        /* Lightbox Modal */
        #lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 7, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 200; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; 
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        
        #lightbox-img {
            max-width: 90%; max-height: 85%; object-fit: contain; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            transform: scale(0.9) translateY(20px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #lightbox-overlay.active #lightbox-img { transform: scale(1) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <canvas id="top-canvas"></canvas>

    <div class="content-layer">
        <nav>
            <button onclick="window.switchPage('home')" id="btn-home" class="active i18n" data-en="INDEX" data-zh="首页">INDEX</button>
            <button onclick="window.switchPage('works')" id="btn-works" class="i18n" data-en="PROJECTS" data-zh="作品集">PROJECTS</button>
            <button onclick="toggleLanguage()" id="btn-lang" class="lang-btn">中 / EN</button>
        </nav>

        <!-- Home Page -->
        <div id="home" class="page active">
            <h1 class="i18n" data-en="KE'S Warehouse" data-zh="KE 的设计仓库" style="font-size: 4rem; letter-spacing: 12px; margin: 0; font-weight: 300; background: linear-gradient(135deg, #fff 30%, #FFE3B3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">KE'S Warehouse</h1>
            <p class="i18n" data-en="Collections" data-zh="设计与工程作品集" style="color: #555; margin-top: 12px; letter-spacing: 4px; font-size: 13px; text-transform: uppercase;">Collections</p>
        </div>

        <!-- Works Page (Only PTC Workspace, Old Grid Cards Removed) -->
        <div id="works" class="page">
            <div class="ptc-workspace">
                <aside class="ptc-sidebar">
                    <div class="sidebar-header">
                        <span class="brand-title">CAD.FEATURE_TREE</span>
                        <span style="font-size: 0.7rem; color: #888;">v2.0</span>
                    </div>
                    <nav class="tree-nav" id="treeNav"></nav>
                </aside>

                <main class="ptc-main">
                    <header class="top-bar">
                        <div class="breadcrumb" id="breadcrumb">
                            <span class="i18n" data-en="Select a project folder from the CAD feature tree" data-zh="请从左侧 CAD 特征树选择项目文件夹">Select a project folder from the CAD feature tree</span>
                        </div>
                        <button id="scrollToTopBtn" class="control-btn i18n" data-en="↑ Top" data-zh="↑ 顶部">↑ Top</button>
                    </header>

                    <section class="gallery-viewport" id="galleryViewport">
                        <div class="empty-state" id="emptyState">
                            <div style="font-size: 2.5rem; margin-bottom: 12px; color: var(--accent-color);">⚡</div>
                            <h3 class="i18n" data-en="FEATURE TREE NAVIGATION" data-zh="特征树导航">FEATURE TREE NAVIGATION</h3>
                            <p class="i18n" data-en="Select any project from the left sidebar to render presentation sheets." data-zh="从左侧侧边栏选择项目以渲染高清展板长图。">Select any project from the left sidebar to render presentation sheets.</p>
                        </div>
                        <div class="image-stream" id="imageStream"></div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <!-- Lightbox Overlay -->
    <div id="lightbox-overlay" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged View">
    </div>

    <script>
        // 1. Portfolio 3-Tier Structure Data
        const portfolioData = [
          {
            title: "Transportation",
            icon: "♞",
            subcategories: [
              {
                name: "Vehicle_researches",
                projects: [
                  { name: "Prototypes", path: "images/Vehicle_researches/Prototypes" },
                  { name: "Vehicle_references", path: "images/Vehicle_researches/Vehicle_references" },
                  { name: "Works", path: "images/Vehicle_researches/Works" }
                ]
              },
              {
                name: "Aircraft_Researches",
                projects: [
                  { name: "Aircraft_References", path: "images/Aircraft_Researches/Aircraft_References" },
                  { name: "Aircraft_works", path: "images/Aircraft_Researches/Aircraft_works" }
                ]
              },
              {
                name: "Derailleur",
                projects: [
                  { name: "Fairing", path: "images/Derailleur/Fairing" },
                  { name: "Hollow_type", path: "images/Derailleur/Hollow_type" }
                ]
              },
              {
                name: "Clay_Bmw_Gen12",
                projects: [
                  { name: "Chassis", path: "images/Clay_Bmw_Gen12/Chassis" },
                  { name: "Works", path: "images/Clay_Bmw_Gen12/Works" }
                ]
              },
              {
                name: "E_MP",
                projects: [
                  { name: "E-MP_References", path: "images/E_MP/E-MP_References" },
                  { name: "Main_Gallery", path: "images/E_MP" }
                ]
              }
            ]
          },
          {
            title: "Discoveries",
            icon: "♞",
            subcategories: [
              {
                name: "Skills",
                projects: [
                  { name: "Modeling_Work", path: "images/Skills/Modeling_Work" },
                  { name: "Pistol_Study", path: "images/Skills/Pistol_Study" },
                  { name: "Plumbing", path: "images/Skills/Plumbing" },
                  { name: "Technical_Skills", path: "images/Skills/Technical_Skills" },
                  { name: "Web_Dev", path: "images/Skills/Web_Dev" }
                ]
              },
              {
                name: "Topology_researches",
                projects: [
                  { name: "Topology_researches", path: "images/Topology_researches" }
                ]
              }
            ]
          },
          {
            title: "Commissioned_Works",
            icon: "♞",
            subcategories: [
              {
                name: "Course_Projects",
                projects: [
                  { name: "Campus_display_board", path: "images/Course_Projects/Campus_display_board" },
                  { name: "Competitions", path: "images/Course_Projects/Competitions" },
                  { name: "Courseworks", path: "images/Course_Projects/Courseworks" },
                  { name: "Lamps", path: "images/Course_Projects/Lamps" }
                ]
              },
              {
                name: "Client_projects",
                projects: [
                  { name: "Client_projects", path: "images/Client_projects" }
                ]
              }
            ]
          },
          {
            title: "Others",
            icon: "♞",
            subcategories: [
              {
                name: "Everyday_Items",
                projects: [
                  { name: "Brackets", path: "images/Everyday_Items/Brackets" },
                  { name: "Others", path: "images/Everyday_Items/Others" },
                  { name: "Trash_bin", path: "images/Everyday_Items/Trash_bin" }
                ]
              },
              {
                name: "References",
                projects: [
                  { name: "References", path: "images/References" }
                ]
              }
            ]
          }
        ];

        // Extended Extensions for Case Sensitivity Probing
        const IMAGE_EXTENSIONS = ['.png', '.jpg', '.jpeg', '.webp', '.PNG', '.JPG', '.JPEG'];
        const MAX_IMAGES_PER_FOLDER = 99;

        // 2. Bilingual Switching Engine
        let currentLang = 'en';
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            document.querySelectorAll('.i18n').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (text) el.textContent = text;
            });
            document.getElementById('btn-lang').textContent = currentLang === 'en' ? '中 / EN' : 'EN / 中';
        }

        // 3. Navigation Switcher
        window.switchPage = function(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(p).classList.add('active');
            document.getElementById('btn-'+p).classList.add('active');
        };

        // 4. Render 3-Tier Tree Navigation
        const treeNav = document.getElementById('treeNav');
        const breadcrumb = document.getElementById('breadcrumb');
        const galleryViewport = document.getElementById('galleryViewport');
        const emptyState = document.getElementById('emptyState');
        const imageStream = document.getElementById('imageStream');

        function buildTreeNavigation() {
          treeNav.innerHTML = '';

          portfolioData.forEach((category) => {
            const catDiv = document.createElement('div');
            catDiv.className = 'tree-category';

            const titleNode = document.createElement('div');
            titleNode.className = 'title-node';
            titleNode.innerHTML = `<span class="icon">►</span> ${category.icon} ${category.title}`;

            const subCatList = document.createElement('div');
            subCatList.className = 'subcategory-list';

            category.subcategories.forEach((subcat) => {
              const subCatNode = document.createElement('div');
              subCatNode.className = 'subcategory-node';
              subCatNode.innerHTML = `<span class="icon">►</span> 📂 ${subcat.name}`;

              const projectList = document.createElement('div');
              projectList.className = 'project-list';

              subcat.projects.forEach((proj) => {
                const projNode = document.createElement('div');
                projNode.className = 'project-node';
                projNode.innerHTML = `📄 ${proj.name}`;

                projNode.addEventListener('click', (e) => {
                  e.stopPropagation();
                  setActiveProject(projNode, category.title, subcat.name, proj);
                });

                projectList.appendChild(projNode);
              });

              subCatNode.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = projectList.classList.contains('open');
                projectList.classList.toggle('open');
                subCatNode.querySelector('.icon').textContent = isOpen ? '►' : '▼';
              });

              subCatList.appendChild(subCatNode);
              subCatList.appendChild(projectList);
            });

            titleNode.addEventListener('click', () => {
              const isOpen = subCatList.classList.contains('open');
              subCatList.classList.toggle('open');
              titleNode.querySelector('.icon').textContent = isOpen ? '►' : '▼';
            });

            catDiv.appendChild(titleNode);
            catDiv.appendChild(subCatList);
            treeNav.appendChild(catDiv);
          });
        }

        function setActiveProject(node, title, subcat, project) {
          document.querySelectorAll('.project-node').forEach(n => n.classList.remove('active'));
          node.classList.add('active');

          breadcrumb.innerHTML = `
            <span>${title}</span>
            <span class="separator">/</span>
            <span>${subcat}</span>
            <span class="separator">/</span>
            <span style="color: var(--accent-color); font-weight: 600;">${project.name}</span>
          `;

          emptyState.style.display = 'none';
          imageStream.innerHTML = '';

          loadProjectImages(project.path);
        }

        // 5. Image Probing Loader with Case Sensitivity and Path Encoding
        async function loadProjectImages(folderPath) {
          let activeIndex = 1;

          while (activeIndex <= MAX_IMAGES_PER_FOLDER) {
            const paddedNum = String(activeIndex).padStart(2, '0');
            const foundImage = await testImageSrc(folderPath, paddedNum);

            if (foundImage) {
              renderImageCard(foundImage, paddedNum);
              activeIndex++;
            } else {
              break;
            }
          }

          if (activeIndex === 1) {
            imageStream.innerHTML = `
              <div class="empty-state">
                <p>No valid indexed images (01, 02...) detected in <code>${folderPath}</code></p>
              </div>
            `;
          }
        }

        function testImageSrc(folderPath, num) {
          return new Promise((resolve) => {
            let tried = 0;
            let resolved = false;

            IMAGE_EXTENSIONS.forEach((ext) => {
              const testUrl = encodeURI(`${folderPath}/${num}${ext}`);
              const img = new Image();

              img.onload = () => {
                if (!resolved) {
                  resolved = true;
                  resolve(testUrl);
                }
              };

              img.onerror = () => {
                tried++;
                if (tried === IMAGE_EXTENSIONS.length && !resolved) {
                  resolve(null);
                }
              };

              img.src = testUrl;
            });
          });
        }

        function renderImageCard(src, indexStr) {
          const card = document.createElement('div');
          card.className = 'gallery-card';
          card.onclick = () => openLightbox(src);

          const img = document.createElement('img');
          img.src = src;
          img.loading = 'lazy';
          img.alt = `Design Sheet ${indexStr}`;

          const meta = document.createElement('div');
          meta.className = 'card-meta';
          meta.innerHTML = `
            <span>SHEET: ${indexStr}</span>
            <span>STATUS: RENDERED</span>
          `;

          card.appendChild(img);
          card.appendChild(meta);
          imageStream.appendChild(card);
        }

        document.getElementById('scrollToTopBtn').addEventListener('click', () => {
          galleryViewport.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 6. Lightbox Functions
        function openLightbox(url) {
            const overlay = document.getElementById('lightbox-overlay');
            const img = document.getElementById('lightbox-img');
            img.src = url;
            overlay.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox-overlay').classList.remove('active');
        }

        // 7. Particle Canvas Animation Engine
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const topCanvas = document.getElementById('top-canvas');
        const topCtx = topCanvas.getContext('2d');

        const dpr = window.devicePixelRatio || 1;
        let w = window.innerWidth;
        let h = window.innerHeight;

        function initCanvasSize() {
            w = window.innerWidth;
            h = window.innerHeight;
            bgCanvas.width = topCanvas.width = w * dpr;
            bgCanvas.height = topCanvas.height = h * dpr;
            bgCanvas.style.width = topCanvas.style.width = w + 'px';
            bgCanvas.style.height = topCanvas.style.height = h + 'px';
            bgCtx.scale(dpr, dpr);
            topCtx.scale(dpr, dpr);
        }
        initCanvasSize();
        window.addEventListener('resize', initCanvasSize);

        const particles = [];
        const totalParticles = 6000; 
        
        const colors = [
            '#FFE3B3', '#FFC563', '#0099FF', '#00FFFF', '#FFFFFF', 
            'rgba(255, 227, 179, 0.95)', 'rgba(0, 255, 255, 0.95)'
        ];
        
        let globalTime = 0;
        let lastTime = performance.now();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * w; 
                this.y = Math.random() * h;
                
                const sizeRand = Math.random();
                if (sizeRand > 0.8) {
                    this.width = Math.random() * 6 + 4;  
                    this.height = Math.random() * 1.5 + 0.8;
                    this.velocity = Math.random() * 0.5 + 0.2;
                } else {
                    this.width = Math.random() * 3 + 1.5;    
                    this.height = Math.random() * 0.8 + 0.4;
                    this.velocity = Math.random() * 0.7 + 0.4; 
                }
                
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.rotation = Math.random() * Math.PI * 2;
                this.angle = Math.random() * Math.PI * 2;
                
                this.ix = 0;
                this.iy = 0;
                this.alpha = 0; 
            }
            
            update(mouse, time, dt, breathingRadius, currentFriction) {
                if (this.alpha < 1) this.alpha += 0.008 * dt; 

                let flowDirX = Math.sin(time * 0.0007) * 1.5;
                let flowDirY = Math.cos(time * 0.0005 + 1.0) * 1.2;
                this.angle = Math.sin(this.x * 0.0025 + flowDirX) + Math.cos(this.y * 0.0025 + flowDirY);

                let baseVx = Math.cos(this.angle) * this.velocity;
                let baseVy = Math.sin(this.angle) * this.velocity;

                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < breathingRadius && dist > 1) {
                    let force = (breathingRadius - dist) / breathingRadius; 
                    
                    let dirX = dx / dist;
                    let dirY = dy / dist;
                    
                    let pullStrength = force * 0.58; 
                    this.ix += dirX * pullStrength * dt;
                    this.iy += dirY * pullStrength * dt;
                    
                    let coreFriction = Math.pow(0.968 - (0.09 * force), dt);
                    this.ix *= coreFriction;
                    this.iy *= coreFriction;
                    
                    baseVx *= (1 - force * 0.85);
                    baseVy *= (1 - force * 0.85);
                } else {
                    this.ix *= currentFriction; 
                    this.iy *= currentFriction;
                }

                this.x += (baseVx + this.ix) * dt;
                this.y += (baseVy + this.iy) * dt;

                if(this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
                
                this.rotation += (0.015 + (Math.abs(this.ix) + Math.abs(this.iy)) * 0.004) * dt;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            }
        }

        for (let i = 0; i < totalParticles; i++) particles.push(new Particle());

        let mouse = { x: -2000, y: -2000 };
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', e => { 
            const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; 
        }, { passive: true });

        window.addEventListener('touchend', () => { window.scrollTo(0, 0); });

        function animate() {
            let currentTime = performance.now();
            let dt = (currentTime - lastTime) / 16.666;
            
            if (dt > 2.0 || dt < 0.1 || isNaN(dt)) dt = 1.0; 
            lastTime = currentTime;

            globalTime += dt;
            
            bgCtx.fillStyle = 'rgba(3, 3, 7, 0.12)';
            bgCtx.fillRect(0, 0, w, h);
            
            topCtx.globalCompositeOperation = 'lighter';
            topCtx.clearRect(0, 0, w, h);

            let breathingRadius = 160 + Math.sin(globalTime * 0.002) * 90;
            let currentFriction = Math.pow(0.968, dt);

            particles.forEach(p => {
                p.update(mouse, globalTime, dt, breathingRadius, currentFriction);
                p.draw(topCtx);
            });

            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // Build 3-Tier Tree Navigation Menu on Init
        buildTreeNavigation();
    </script>
</body>
</html>
