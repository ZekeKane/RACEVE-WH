<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KE's Warehouse</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            /* GitHub Dark Mode Colors */
            --accent-color: #FFE3B3; 
            --gh-text-main: #e6edf3;
            --gh-text-muted: #8b949e;
            --gh-border: #30363d;
            --gh-hover: rgba(177, 186, 196, 0.12);
            --gh-active: rgba(0, 229, 255, 0.15);
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            position: fixed; 
            overflow: hidden; 
            background-color: #030307; 
            color: white; 
            font-family: var(--font-sans); 
        }
        
        #bg-canvas, #top-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #bg-canvas { z-index: 0; }
        #top-canvas { z-index: 50; } 
        
        .content-layer { position: relative; z-index: 60; width: 100%; height: 100vh; pointer-events: none; }
        
        nav, .page { pointer-events: auto; }
        
        /* Transparent Glassmorphic Navigation Bar */
        nav { 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: 65px;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            background: linear-gradient(to bottom, rgba(3,3,7,0.95) 0%, rgba(3,3,7,0) 100%); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        nav button { 
            background: none; 
            border: none; 
            color: var(--gh-text-muted); 
            padding: 0 20px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px; 
            transition: 0.3s; 
            letter-spacing: 2px; 
            font-family: var(--font-mono);
        }
        nav button.active, nav button:hover { 
            color: var(--accent-color); 
            text-shadow: 0 0 15px rgba(255,227,179,0.6); 
        }
        
        .lang-btn {
            position: absolute;
            right: 40px;          
            color: var(--accent-color) !important;
            border: 1px solid rgba(255, 227, 179, 0.25) !important;
            border-radius: 20px;
            padding: 4px 14px !important;
            font-size: 12px !important;
            letter-spacing: 1px !important;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 15px rgba(255, 227, 179, 0.3);
        }
        
        /* 
         * FIX: Container Layout 
         * Used display: block instead of flex center to prevent cutoff bugs
         */
        .page { 
            position: fixed; 
            top: 65px; 
            left: 0; 
            width: 100vw; 
            height: calc(100vh - 65px);
            opacity: 0; 
            pointer-events: none; 
            transform: scale(0.98); 
            transition: opacity 0.4s ease, transform 0.4s ease;
            overflow: hidden;
        }
        
        .page.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: scale(1); 
        }

        #home {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #works {
            padding: 20px 24px 24px 24px;
            display: block; /* Prevents the flex-center cutoff bug */
        }

        .ptc-workspace {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1600px;
            height: 100%;
            margin: 0 auto; /* Horizontal Center */
            border: 1px solid var(--gh-border);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(13, 17, 23, 0.75); /* GitHub Theme Dark */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }

        /* 
         * STRICT SIDEBAR ALIGNMENT 
         */
        .ptc-sidebar {
            width: 300px;
            min-width: 300px;
            flex-shrink: 0;
            height: 100%;
            border-right: 1px solid var(--gh-border);
            display: flex;
            flex-direction: column;
            user-select: none;
            background: rgba(1, 4, 9, 0.6);
        }

        .sidebar-header {
            height: 50px;
            min-height: 50px;
            flex-shrink: 0;
            padding: 0 16px;
            border-bottom: 1px solid var(--gh-border);
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            font-family: var(--font-mono);
        }

        .brand-title {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--gh-text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-nav {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Custom Scrollbars */
        .tree-nav::-webkit-scrollbar, .gallery-viewport::-webkit-scrollbar { width: 6px; }
        .tree-nav::-webkit-scrollbar-thumb, .gallery-viewport::-webkit-scrollbar-thumb { 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 3px; 
        }
        .tree-nav::-webkit-scrollbar-thumb:hover, .gallery-viewport::-webkit-scrollbar-thumb:hover { 
            background: rgba(255, 255, 255, 0.2); 
        }

        /* 
         * GITHUB-STYLE TREE VIEW 
         */
        .tree-category { 
            display: flex !important; 
            flex-direction: column !important; 
            width: 100%;
        }

        .title-node {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gh-text-main);
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.1s ease;
        }
        .title-node:hover { background-color: var(--gh-hover); }
        .title-node .icon { width: 16px; display: inline-block; font-size: 0.7rem; color: var(--gh-text-muted); }
        .title-node .folder-icon { margin-right: 6px; font-size: 0.9rem; }

        .subcategory-list {
            padding-left: 20px;
            margin-left: 6px;
            border-left: 1px solid var(--gh-border);
            display: none !important;
            flex-direction: column !important;
        }
        .subcategory-list.open { display: flex !important; }

        .subcategory-node {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            font-family: var(--font-sans);
            font-size: 0.82rem;
            color: var(--gh-text-main);
            cursor: pointer;
            border-radius: 6px;
            margin-top: 2px;
        }
        .subcategory-node:hover { background-color: var(--gh-hover); }
        .subcategory-node .icon { width: 16px; display: inline-block; font-size: 0.7rem; color: var(--gh-text-muted); }

        .project-list {
            padding-left: 20px;
            margin-left: 6px;
            border-left: 1px solid var(--gh-border);
            display: none !important;
            flex-direction: column !important;
        }
        .project-list.open { display: flex !important; }

        .project-node {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--gh-text-muted);
            cursor: pointer;
            border-radius: 6px;
            margin-top: 2px;
            transition: all 0.15s ease;
        }
        .project-node:hover { color: var(--gh-text-main); background-color: var(--gh-hover); }
        .project-node.active {
            color: #00e5ff;
            background-color: var(--gh-active);
        }
        .project-node .file-icon { margin-right: 6px; font-size: 0.85rem; opacity: 0.8; }

        /* Right Viewport */
        .ptc-main {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(13, 17, 23, 0.4);
            overflow: hidden;
        }

        .top-bar {
            height: 50px;
            min-height: 50px;
            flex-shrink: 0;
            padding: 0 24px;
            border-bottom: 1px solid var(--gh-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(1, 4, 9, 0.4);
        }

        .breadcrumb {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--gh-text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .breadcrumb .separator { color: var(--gh-border); }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gh-border);
            color: var(--gh-text-main);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .control-btn:hover { border-color: var(--gh-text-muted); background: var(--gh-hover); }

        .gallery-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--gh-text-muted);
            text-align: center;
            font-family: var(--font-sans);
        }
        .empty-state h3 { color: var(--gh-text-main); margin-bottom: 8px; font-weight: 600; }

        .image-stream {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .gallery-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--gh-border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.2s ease;
            cursor: pointer;
        }
        .gallery-card:hover { border-color: var(--gh-text-muted); }
        .gallery-card img { width: 100%; height: auto; display: block; }

        .card-meta {
            padding: 10px 16px;
            background: rgba(1, 4, 9, 0.6);
            border-top: 1px solid var(--gh-border);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--gh-text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* Lightbox Modal */
        #lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(1, 4, 9, 0.9); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; 
            transition: opacity 0.3s ease;
        }
        #lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        
        #lightbox-img {
            max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.3s ease;
        }
        #lightbox-overlay.active #lightbox-img { transform: scale(1); opacity: 1; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="content-layer">

        </nav>

        <div id="home" class="page active">

        <div id="works" class="page">

                <main class="ptc-main">

                        </div>
                        <button id="scrollToTopBtn" class="control-btn i18n" data-en="Top ↑" data-zh="顶部 ↑">Top ↑</button>
                    </header>

                    <section class="gallery-viewport" id="galleryViewport">
                        <div class="empty-state" id="emptyState">
                            <div style="font-size: 2.5rem; margin-bottom: 16px; color: var(--gh-text-muted);">📁</div>
                            <h3 class="i18n" data-en="No project selected" data-zh="未选择项目">No project selected</h3>
                            <p class="i18n" data-en="Select any folder from the left sidebar to render presentation sheets." data-zh="从左侧文件树选择项目以渲染高清展板长图。">Select any folder from the left sidebar to render presentation sheets.</p>
                        </div>
                        <div class="image-stream" id="imageStream"></div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-overlay" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged View">
    </div>
